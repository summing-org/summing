[agent]
# Empty means the default model selected by Codex.
model = ""
effort = "medium"
max_parallel_conversations = 4
stream_interval_sec = 1.0
# Per participant and group. This protects explicitly addressed participant turns;
# background evidence is admitted before this limit and uses the Team Space loop.
participant_rate_limit_messages = 12
participant_rate_limit_window_sec = 60
# Required for git fetch/push and dependency downloads inside a Codex turn.
network_access = true

[team_memory]
# Persist every authorized team message before reply/rate-limit decisions.
enabled = true
# Keep false until the operator explicitly approves sending bounded team-event
# conversation episodes to the administrator's Codex App Server.
model_egress_enabled = false
# One Conversation Understanding Loop resets this quiet window on every new event.
understanding_quiet_sec = 20
# Continuous chatter cannot postpone understanding beyond this hard deadline.
understanding_max_wait_sec = 90
# Reaching this source-local batch size starts the loop immediately.
understanding_max_events = 40
orientation_event_threshold = 50
intervention_cooldown_sec = 3600
# Raw text is redacted after this many days; 0 keeps it indefinitely. Knowledge
# and source references remain so corrections stay explainable.
raw_retention_days = 365
# Transparently announce durable observation when the bot joins a group.
announce_on_join = true

[codex_usage]
# Publish the VPS account's weekly remaining usage in the bot profile.
profile_enabled = true
refresh_interval_sec = 900
timezone = "Europe/Moscow"

[transcription]
# OpenAI is the default; set provider = "groq" and a Groq Whisper model to switch.
provider = "openai"
model = "gpt-transcribe"
# Telegram Bot API downloads are currently limited to 20 MB.
max_file_bytes = 20000000

[health]
port = 8765

[viewer]
# Project Viewer always listens on loopback. Set SUMMING_VIEWER_URL after
# configuring a public HTTPS reverse proxy.
port = 8766
public_url = ""
auth_max_age_sec = 900
runner_socket = "/run/summing-runner/runner.sock"

# Static projects belong to TELEGRAM_OWNER_ID. The administrator can also create
# managed projects under $SUMMING_DATA_DIR/repositories with /project_create.
[projects.summing]
name = "SUMMING"
default_workspace = "repo"
self_change = true

[projects.summing.workspaces.repo]
path = "/opt/summing"

[projects.secret-cloud]
name = "Secret Cloud"
default_workspace = "web-app"

[projects.secret-cloud.workspaces.web-app]
path = "/srv/projects/secret-cloud/web-app"

[projects.secret-cloud.workspaces.backend]
path = "/srv/projects/secret-cloud/backend"
