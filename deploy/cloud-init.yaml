#cloud-config

# Hetzner Cloud user-data for a fresh Ubuntu 24.04 x86_64 server.
# This file intentionally contains no Telegram token or transcription credentials,
# private repository key, or other secret: cloud-init user-data is retained in
# provider and instance metadata.

package_update: true
package_upgrade: true
timezone: Etc/UTC

packages:
  - apparmor-profiles
  - apparmor-utils
  - bubblewrap
  - ca-certificates
  - curl
  - git
  - file
  - jq
  - openssh-client
  - rsync
  - sqlite3
  - sudo
  - ufw
  - unattended-upgrades
  - unzip
  - xz-utils

write_files:
  - path: /etc/codex/requirements.toml
    owner: root:root
    permissions: "0644"
    content: |
      allow_login_shell = false
      allow_managed_hooks_only = true

      [features]
      apps = false
      browser_use = false
      browser_use_external = false
      browser_use_full_cdp_access = false
      computer_use = false
      hooks = false
      image_generation = false
      in_app_browser = false
      memories = false
      multi_agent = false
      plugins = false
      remote_plugin = false
      skill_mcp_dependency_install = false
      skill_search = false
      workspace_dependencies = false

      [mcp_servers]

      [plugins]

  - path: /usr/local/sbin/summing-bootstrap
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      node_version="v24.18.0"
      node_archive="node-${node_version}-linux-x64.tar.xz"
      node_dir="/opt/node-${node_version}"

      if ! id summing >/dev/null 2>&1; then
        useradd \
          --system \
          --create-home \
          --home-dir /var/lib/summing \
          --shell /usr/sbin/nologin \
          summing
      fi

      install -d -o summing -g summing -m 0700 /var/lib/summing/data
      install -d -o summing -g summing -m 0700 /var/lib/summing/data/codex
      install -d -o summing -g summing -m 0700 /var/lib/summing/data/worktrees
      install -d -o root -g summing -m 0750 /etc/summing
      install -d -o summing -g summing -m 0750 /opt/summing
      install -d -o summing -g summing -m 0750 /srv/projects
      chown root:summing /etc/summing/summing.env
      chmod 0640 /etc/summing/summing.env

      if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then
        if [ ! -f /swapfile ]; then
          fallocate -l 4G /swapfile
          chmod 0600 /swapfile
          mkswap /swapfile
        fi
        swapon /swapfile
      fi
      if ! grep -q '^/swapfile ' /etc/fstab; then
        printf '%s\n' '/swapfile none swap sw 0 0' >> /etc/fstab
      fi
      printf '%s\n' 'vm.swappiness=10' > /etc/sysctl.d/60-summing-swap.conf
      sysctl --system >/dev/null

      if [ ! -x "${node_dir}/bin/node" ]; then
        download_dir="$(mktemp -d)"
        trap 'rm -rf "${download_dir}"' EXIT
        curl -fsSL \
          "https://nodejs.org/dist/${node_version}/${node_archive}" \
          -o "${download_dir}/${node_archive}"
        curl -fsSL \
          "https://nodejs.org/dist/${node_version}/SHASUMS256.txt" \
          -o "${download_dir}/SHASUMS256.txt"
        (
          cd "${download_dir}"
          grep " ${node_archive}$" SHASUMS256.txt | sha256sum -c -
        )
        install -d -m 0755 "${node_dir}"
        tar -xJf "${download_dir}/${node_archive}" \
          -C "${node_dir}" \
          --strip-components=1
      fi
      ln -sfn "${node_dir}/bin/node" /usr/local/bin/node
      ln -sfn "${node_dir}/bin/npm" /usr/local/bin/npm
      ln -sfn "${node_dir}/bin/npx" /usr/local/bin/npx
      ln -sfn "${node_dir}/bin/corepack" /usr/local/bin/corepack

      sudo -u summing \
        env HOME=/var/lib/summing PATH=/usr/local/bin:/usr/bin:/bin \
        bash -c \
        'cd /var/lib/summing && curl -fsSL https://chatgpt.com/codex/install.sh | sh'
      test -x /var/lib/summing/.local/bin/codex
      ln -sfn /var/lib/summing/.local/bin/codex /usr/local/bin/codex

      printf '%s\n' \
        'APT::Periodic::Update-Package-Lists "1";' \
        'APT::Periodic::Unattended-Upgrade "1";' \
        > /etc/apt/apt.conf.d/20auto-upgrades
      systemctl enable --now unattended-upgrades

      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw --force enable

      printf '%s\n' \
        'PermitRootLogin prohibit-password' \
        'PasswordAuthentication no' \
        'KbdInteractiveAuthentication no' \
        > /etc/ssh/sshd_config.d/60-summing-hardening.conf
      sshd -t
      systemctl reload ssh

      node --version
      npm --version
      codex --version
      git --version

  - path: /etc/summing/summing.env
    owner: root:root
    permissions: "0640"
    content: |
      SUMMING_DATA_DIR=/var/lib/summing/data
      SUMMING_CONFIG=/var/lib/summing/data/config.toml
      SUMMING_WORKTREE_ROOT=/var/lib/summing/data/worktrees
      SUMMING_DEPLOY_REQUEST=/var/lib/summing/deploy/request.json
      SUMMING_DEPLOY_STATE=/var/lib/summing/deploy/state.json
      CODEX_HOME=/var/lib/summing/data/codex
      CODEX_BIN=/usr/local/bin/codex
      TELEGRAM_BOT_TOKEN=
      TELEGRAM_OWNER_ID=
      TRANSCRIPTION_PROVIDER=openai
      TRANSCRIPTION_MODEL=gpt-transcribe
      OPENAI_API_KEY=
      GROQ_API_KEY=
      NODE_ENV=production

  - path: /root/SUMMING_NEXT_STEPS.txt
    owner: root:root
    permissions: "0600"
    content: |
      SUMMING host bootstrap is complete.

      1. Upload the private repository, including .git, to /opt/summing.
      2. Set TELEGRAM_BOT_TOKEN, TELEGRAM_OWNER_ID and OPENAI_API_KEY in:
         /etc/summing/summing.env
      3. Run:
         /opt/summing/deploy/activate.sh
      4. Send /login to the bot and complete ChatGPT device-code login.
      5. In the administrator's private bot chat, create a managed project:
         /project_create client_name 123456789 repo_name

runcmd:
  - [bash, /usr/local/sbin/summing-bootstrap]

final_message: >-
  SUMMING host bootstrap completed. Read /root/SUMMING_NEXT_STEPS.txt and
  upload the repository before activating the service.
