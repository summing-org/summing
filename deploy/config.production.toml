[agent]
# Empty means the default model selected by Codex.
model = ""
effort = "medium"
# A safe starting point for a 4 GiB VPS. Increase on a larger server.
max_parallel_conversations = 2
stream_interval_sec = 5.0
participant_rate_limit_messages = 12
participant_rate_limit_window_sec = 60
network_access = true

[team_memory]
enabled = true
# Enable only after explicit operator approval of background team-message egress.
model_egress_enabled = false
model = "gpt-5.6-luna"
effort = "low"
understanding_quiet_sec = 60
understanding_max_wait_sec = 300
understanding_max_events = 100
orientation_event_threshold = 50
intervention_cooldown_sec = 3600
raw_retention_days = 365
announce_on_join = true

[knowledge_sync]
# Set true only after SUMMING_S3_* variables are configured in /etc/summing/summing.env.
enabled = false
telegram_terms_reviewed = false
object_store = "s3"
spool_root = "/var/lib/summing/data/knowledge-spool"
spool_max_bytes = 8000000000
mtproto_master_key = "/etc/summing/mtproto.key"
transfer_key = "/etc/summing/kb-transfer.key"
embedding_model = "text-embedding-3-small"
embedding_dimensions = 1536
embedding_batch_size = 64
document_vision_model = "gpt-5.4-nano"
s3_region = "us-east-1"
s3_prefix = "summing"
s3_sse = "AES256"

[codex_usage]
profile_enabled = true
refresh_interval_sec = 900
timezone = "Europe/Moscow"

[transcription]
provider = "openai"
model = "gpt-transcribe"
max_file_bytes = 20000000

[health]
port = 8765

[viewer]
port = 8766
public_url = ""
auth_max_age_sec = 900
runner_socket = "/run/summing-runner/runner.sock"

# Static projects belong to TELEGRAM_OWNER_ID. Managed client projects are
# created from the administrator's private Telegram chat.
[projects.summing]
name = "SUMMING"
default_workspace = "repo"
self_change = true

[projects.summing.workspaces.repo]
path = "/opt/summing"
