[agent]
# Empty means the default model selected by Codex.
model = ""
effort = "medium"
# A safe starting point for a 4 GiB VPS. Increase on a larger server.
max_parallel_conversations = 2
stream_interval_sec = 1.0
participant_batch_sec = 20
participant_rate_limit_messages = 12
participant_rate_limit_window_sec = 60
network_access = true

[codex_usage]
profile_enabled = true
refresh_interval_sec = 900
timezone = "Europe/Moscow"

[transcription]
provider = "openai"
model = "gpt-transcribe"
max_file_bytes = 20000000

[health]
port = 8765

[viewer]
port = 8766
public_url = ""
auth_max_age_sec = 900
runner_socket = "/run/summing-runner/runner.sock"

# Static projects belong to TELEGRAM_OWNER_ID. Managed client projects are
# created from the administrator's private Telegram chat.
[projects.summing]
name = "SUMMING"
default_workspace = "repo"
self_change = true

[projects.summing.workspaces.repo]
path = "/opt/summing"
