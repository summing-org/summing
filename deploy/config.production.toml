[agent]
# Empty means the default model selected by Codex.
model = ""
effort = "medium"
# A safe starting point for a 4 GiB VPS. Increase on a larger server.
max_parallel_conversations = 2
stream_interval_sec = 1.0
network_access = true

[health]
port = 8765

[projects.summate]
name = "Summate"
default_workspace = "repo"
self_change = true

[projects.summate.workspaces.repo]
path = "/opt/summate"
